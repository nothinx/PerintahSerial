name=PerintahSerial
version=1.0.1
author=Amadeo Wisesa <wisesaamadeo@gmail.com>
maintainer=Amadeo Wisesa <wisesaamadeo@gmail.com>
sentence=Membaca perintah teks dari Serial Monitor, Bluetooth HC-05, atau Stream apa pun ("LED ON", "SET kp 2.5"). Non-blocking, tanpa callback.
paragraph=Untuk debugging, tuning PID tanpa upload ulang, dan kontrol robot dari HP. Menerima akhiran CR, LF, atau CRLF, tidak membedakan huruf besar/kecil, argumen dipisah spasi, koma, atau tanda sama dengan. Angka dan desimal dengan nilai bawaan jika input salah. Buffer tetap tanpa String, baris terlalu panjang dibuang utuh dan dilaporkan. Bekerja di AVR, ESP32, dan STM32. English: serial command parser, command line, CLI, non-blocking, case-insensitive, Bluetooth, no String, no malloc.
category=Communication
url=https://github.com/nothinx/PerintahSerial
architectures=*
includes=PerintahSerial.h
